# ═══════════════════════════════════════════════════════════════════
# CLOUDFLARE PAGES — RJ Business Solutions TAX PRO HUB UNIVERSITY
# ═══════════════════════════════════════════════════════════════════
# Deploy:
#   npm run cf:setup   (one-time: creates D1 + KV, applies migrations,
#                       fills the ids below)
#   npm run deploy
#
# The functions/ directory ships automatically with Pages —
# every /api/* route runs as a Cloudflare Worker at the edge with D1.
#
# Secrets (set once per environment):
#   npx wrangler pages secret put TWILIO_ACCOUNT_SID
#   npx wrangler pages secret put TWILIO_AUTH_TOKEN
#   npx wrangler pages secret put TWILIO_FROM_NUMBER
#   npx wrangler pages secret put STRIPE_SECRET_KEY
#   npx wrangler pages secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler pages secret put CF_CALLS_APP_ID        # Cloudflare Calls (video)
#   npx wrangler pages secret put CF_CALLS_APP_SECRET
#   npx wrangler pages secret put OPENAI_API_KEY         # any OpenAI-compatible provider
#   npx wrangler pages secret put OPENAI_BASE_URL
#   npx wrangler pages secret put RESEND_API_KEY         # optional; MailChannels fallback is free
#   npx wrangler pages secret put MAIL_FROM
#   npx wrangler pages secret put SESSION_SECRET         # optional pepper for password hashes
#   npx wrangler pages secret put CRON_SECRET            # shared with workers/cron
#   npx wrangler pages secret put PORTAL_BASE_URL        # e.g. https://app.taxprohubuniversity.com

name = "tax-pro-hub-university"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

# ── Durable ledger + session cache (KV) ──────────────────────────────
# Replace id with: npx wrangler kv namespace create LEDGER
[[kv_namespaces]]
binding = "LEDGER"
id = "efc2da2c19934e68a956a84bfe76f7a2"

# ── Primary database (D1) — created by `npm run cf:setup` ────────────
# Replace database_id with: npx wrangler d1 create taxprohub-crm
[[d1_databases]]
binding = "DB"
database_name = "taxprohub-crm"
database_id = "00000000-0000-0000-0000-000000000000"

# ── Secure document vault (R2) — created by `npm run cf:setup` ───────
# Or manually: npx wrangler r2 bucket create taxprohub-docs
[[r2_buckets]]
binding = "DOCS"
bucket_name = "taxprohub-docs"
