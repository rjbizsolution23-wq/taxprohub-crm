# ═══════════════════════════════════════════════════════════════
# CLOUDFLARE PAGES — Tax Pro Hub University
# Deploy: pnpm build && wrangler pages deploy dist --project-name tax-pro-hub-university
# ═══════════════════════════════════════════════════════════════

name = "tax-pro-hub-university"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

# ── KV Namespaces ────────────────────────────────────────────
[[kv_namespaces]]
binding = "LEDGER"
id = "efc2da2c19934e68a956a84bfe76f7a2"

# ── Observability ────────────────────────────────────────────
[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

# ── Secrets (set via wrangler pages secret put NAME) ─────────
# TWILIO_ACCOUNT_SID      Twilio Account SID
# TWILIO_AUTH_TOKEN       Twilio Auth Token
# TWILIO_FROM_NUMBER      Twilio From Number (+1xxxxxxxxxx)
# STRIPE_SECRET_KEY       Stripe Secret Key (sk_live_...)
# STRIPE_WEBHOOK_SECRET   Stripe Webhook Signing Secret (whsec_...)
# STRIPE_PRICE_STARTER    Stripe Price ID for Starter plan
# STRIPE_PRICE_GROWTH     Stripe Price ID for Growth plan
# STRIPE_PRICE_ENTERPRISE Stripe Price ID for Enterprise plan
# CF_CALLS_APP_ID         Cloudflare Calls App ID
# CF_CALLS_APP_SECRET     Cloudflare Calls App Secret
# OPENAI_API_KEY          OpenAI or compatible API key
# OPENAI_BASE_URL         Optional custom base URL (OpenRouter, CF AI, etc)
# OPENAI_MODEL            Optional model override (gpt-4o-mini, etc)
# RESEND_API_KEY          Resend API key for transactional email
# MAIL_FROM               From address (no-reply@yourdomain.com)
# SUPABASE_URL            Supabase project URL (https://xxx.supabase.co)
# SUPABASE_SERVICE_ROLE_KEY Supabase service role key (for auth proxy)
# GHL_API_KEY             GoHighLevel API key (pit-xxxxx)
# GHL_LOCATION_ID         GoHighLevel location/sub-account ID
# GHL_PIPELINE_ID         GHL Pipeline ID for new leads
# GHL_STAGE_ID            GHL Stage ID for new leads
